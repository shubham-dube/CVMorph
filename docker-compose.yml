services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cvplatform
      POSTGRES_PASSWORD: cvplatform
      POSTGRES_DB: cvplatform
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvplatform"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI API ───────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://cvplatform:cvplatform@postgres:5432/cvplatform
      - DATABASE_URL_SYNC=postgresql+psycopg2://cvplatform:cvplatform@postgres:5432/cvplatform
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SECRET_KEY=local-dev-secret-key-change-in-production
      - DEBUG=true
    env_file:
      - apps/api/.env
    volumes:
      - ./apps/api:/app
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery Worker (default queue: parse + extract) ────────────────────────────
  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://cvplatform:cvplatform@postgres:5432/cvplatform
      - DATABASE_URL_SYNC=postgresql+psycopg2://cvplatform:cvplatform@postgres:5432/cvplatform
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    env_file:
      - apps/api/.env
    volumes:
      - ./apps/api:/app
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run celery -A app.workers.celery_app worker --loglevel=info -Q default

  # ── Celery Worker (rendering queue) ──────────────────────────────────────────
  worker-rendering:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    env_file:
      - apps/api/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://cvplatform:cvplatform@postgres:5432/cvplatform
      - DATABASE_URL_SYNC=postgresql+psycopg2://cvplatform:cvplatform@postgres:5432/cvplatform
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./apps/api:/app
      - ./templates:/templates:ro
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run celery -A app.workers.celery_app worker --loglevel=info -Q rendering

volumes:
  postgres_data:
