services:
  # ── PostgreSQL (Local fallback — ignored when using Supabase in .env) ─────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cvplatform
      POSTGRES_PASSWORD: cvplatform
      POSTGRES_DB: cvplatform
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvplatform"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── FastAPI API (all processing runs inline — no separate workers needed) ─────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - apps/api/.env
    volumes:
      - ./apps/api:/app
      - ./uploads:/app/uploads
    command: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:

